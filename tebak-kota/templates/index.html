<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the City - Beranda</title>
    <!-- Socket.io -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <!-- Tailwind for quick and beautiful UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            font-family: 'Inter', sans-serif;
        }
        .avatar-option {
            cursor: pointer;
            transition: transform 0.2s;
            font-size: 2.5rem;
            padding: 10px;
            border-radius: 50%;
            border: 2px solid transparent;
        }
        .avatar-option.selected {
            border-color: #fbbf24;
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #333;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(253, 160, 133, 0.5);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        /* Hide sections initially */
        .hidden-section { display: none; }
    </style>
</head>
<body class="flex items-center justify-center p-4">

<div class="glass-panel p-8 w-full max-w-md">
    <div class="text-center mb-8">
        <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-500 drop-shadow-md">Guess the City!</h1>
        <p class="text-sm mt-2 text-gray-200">Game Edukasi Kota Indonesia</p>
    </div>

    <!-- Step 1: Profile Setup -->
    <div id="step-profile">
        <h2 class="text-xl font-bold mb-4">Siapkan Profilmu</h2>
        <div class="mb-4">
            <label class="block text-sm mb-2">Nickname:</label>
            <input type="text" id="nickname" class="w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-yellow-400" placeholder="Masukkan nama...">
        </div>
        <div class="mb-6">
            <label class="block text-sm mb-2">Pilih Avatar:</label>
            <div class="flex justify-between" id="avatar-container">
                <div class="avatar-option selected" data-avatar="🦊">🦊</div>
                <div class="avatar-option" data-avatar="🐼">🐼</div>
                <div class="avatar-option" data-avatar="🐯">🐯</div>
                <div class="avatar-option" data-avatar="🐸">🐸</div>
                <div class="avatar-option" data-avatar="🐱">🐱</div>
            </div>
        </div>
        <button id="btn-next" class="btn-primary w-full py-3 rounded-lg text-lg">Lanjut</button>
    </div>

    <!-- Step 2: Main Menu -->
    <div id="step-menu" class="hidden-section">
        <div class="flex items-center mb-6 bg-white/10 p-3 rounded-lg">
            <div id="display-avatar" class="text-3xl mr-3">🦊</div>
            <div id="display-nickname" class="font-bold text-lg">Player</div>
            <button id="btn-edit-profile" class="ml-auto text-xs text-yellow-300 hover:text-yellow-400 underline">Ubah</button>
        </div>
        
        <div class="space-y-4">
            <button id="btn-show-create" class="btn-primary w-full py-3 rounded-lg text-lg">Buat Room (Host)</button>
            <button id="btn-show-join" class="btn-secondary w-full py-3 rounded-lg text-lg">Masukkan Kode Room</button>
            <button id="btn-show-list" class="btn-secondary w-full py-3 rounded-lg text-lg">Lihat List Lobby</button>
        </div>
    </div>

    <!-- Step 3: Create Room -->
    <div id="step-create" class="hidden-section">
        <h2 class="text-xl font-bold mb-4">Buat Room Baru</h2>
        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-sm mb-1">Maksimal Player (2-10):</label>
                <input type="number" id="max-players" min="2" max="10" value="10" class="w-full px-4 py-2 rounded bg-white/20 border border-white/30 text-white focus:outline-none">
            </div>
            <div>
                <label class="block text-sm mb-1">Poin untuk Menang (50-150):</label>
                <input type="number" id="win-points" min="50" max="150" step="10" value="100" class="w-full px-4 py-2 rounded bg-white/20 border border-white/30 text-white focus:outline-none">
            </div>
            <div>
                <label class="block text-sm mb-1">Tingkat Kesulitan:</label>
                <select id="room-difficulty" class="w-full px-4 py-2 rounded bg-white/20 border border-white/30 text-white focus:outline-none">
                    <option class="text-black" value="Easy">Gampang (Easy)</option>
                    <option class="text-black" value="Medium">Sedang (Medium)</option>
                    <option class="text-black" value="Hard">Susah (Hard)</option>
                </select>
            </div>
            <div class="flex items-center mt-2">
                <input type="checkbox" id="room-private" class="w-5 h-5 mr-3 accent-yellow-400">
                <label for="room-private" class="text-sm">Buat Room Privat (Tidak muncul di Lobby)</label>
            </div>
        </div>
        <div class="flex space-x-3">
            <button id="btn-back-from-create" class="btn-secondary flex-1 py-3 rounded-lg">Kembali</button>
            <button id="btn-create-room" class="btn-primary flex-1 py-3 rounded-lg">Buat!</button>
        </div>
    </div>

    <!-- Step 4: Join via Code -->
    <div id="step-join" class="hidden-section">
        <h2 class="text-xl font-bold mb-4">Gabung dengan Kode</h2>
        <input type="text" id="room-code-input" class="w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 text-white text-center text-2xl uppercase tracking-widest mb-6 focus:outline-none" placeholder="KODE5">
        <div class="flex space-x-3">
            <button id="btn-back-from-join" class="btn-secondary flex-1 py-3 rounded-lg">Kembali</button>
            <button id="btn-join-room" class="btn-primary flex-1 py-3 rounded-lg">Gabung!</button>
        </div>
    </div>

    <!-- Step 5: Lobby List -->
    <div id="step-list" class="hidden-section">
        <h2 class="text-xl font-bold mb-4">List Lobby Tersedia</h2>
        <div id="lobby-list" class="space-y-3 mb-6 max-h-60 overflow-y-auto pr-2">
            <!-- Lobbies will be injected here -->
        </div>
        <button id="btn-back-from-list" class="btn-secondary w-full py-3 rounded-lg">Kembali</button>
    </div>

</div>

<script>
    // State
    let currentUser = {
        nickname: '',
        avatar: '🦊',
        isHost: false
    };

    // DOM Elements
    const stepProfile = document.getElementById('step-profile');
    const stepMenu = document.getElementById('step-menu');
    const stepCreate = document.getElementById('step-create');
    const stepJoin = document.getElementById('step-join');
    const stepList = document.getElementById('step-list');

    // Avatar selection
    document.querySelectorAll('.avatar-option').forEach(el => {
        el.addEventListener('click', () => {
            document.querySelectorAll('.avatar-option').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
            currentUser.avatar = el.getAttribute('data-avatar');
        });
    });

    // Navigation
    function showSection(section) {
        [stepProfile, stepMenu, stepCreate, stepJoin, stepList].forEach(el => el.classList.add('hidden-section'));
        section.classList.remove('hidden-section');
    }

    document.getElementById('btn-next').addEventListener('click', () => {
        const nick = document.getElementById('nickname').value.trim();
        if(!nick) {
            alert('Silakan masukkan nickname!');
            return;
        }
        currentUser.nickname = nick;
        document.getElementById('display-nickname').textContent = nick;
        document.getElementById('display-avatar').textContent = currentUser.avatar;
        
        // Save to localStorage for convenience
        localStorage.setItem('tebak_kota_user', JSON.stringify(currentUser));
        
        showSection(stepMenu);
    });

    document.getElementById('btn-edit-profile').addEventListener('click', () => {
        showSection(stepProfile);
    });

    // Check if returning user
    window.onload = () => {
        const saved = localStorage.getItem('tebak_kota_user');
        if (saved) {
            const data = JSON.parse(saved);
            document.getElementById('nickname').value = data.nickname;
            // auto select avatar
            document.querySelectorAll('.avatar-option').forEach(opt => {
                if(opt.getAttribute('data-avatar') === data.avatar) {
                    opt.click();
                }
            });
            currentUser.nickname = data.nickname;
            currentUser.avatar = data.avatar;
            document.getElementById('display-nickname').textContent = data.nickname;
            document.getElementById('display-avatar').textContent = data.avatar;
            showSection(stepMenu);
        }
    };

    // Menu Buttons
    document.getElementById('btn-show-create').addEventListener('click', () => showSection(stepCreate));
    document.getElementById('btn-show-join').addEventListener('click', () => showSection(stepJoin));
    document.getElementById('btn-show-list').addEventListener('click', () => {
        fetchLobbies();
        showSection(stepList);
    });

    // Back Buttons
    document.getElementById('btn-back-from-create').addEventListener('click', () => showSection(stepMenu));
    document.getElementById('btn-back-from-join').addEventListener('click', () => showSection(stepMenu));
    document.getElementById('btn-back-from-list').addEventListener('click', () => showSection(stepMenu));

    // Actions
    document.getElementById('btn-create-room').addEventListener('click', async () => {
        const maxPlayers = document.getElementById('max-players').value;
        const winPoints = document.getElementById('win-points').value;
        const difficulty = document.getElementById('room-difficulty').value;
        const isPrivate = document.getElementById('room-private').checked;
        
        try {
            const res = await fetch('http://localhost:3000/api/rooms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nickname: currentUser.nickname,
                    max_players: maxPlayers,
                    win_points: winPoints,
                    difficulty: difficulty,
                    is_private: isPrivate
                })
            });
            const data = await res.json();
            if(data.success) {
                currentUser.isHost = true;
                localStorage.setItem('tebak_kota_user', JSON.stringify(currentUser));
                window.location.href = `/room/${data.room_code}`;
            }
        } catch (e) {
            alert('Gagal membuat room!');
        }
    });

    document.getElementById('btn-join-room').addEventListener('click', () => {
        const code = document.getElementById('room-code-input').value.trim().toUpperCase();
        if(!code) return alert('Masukkan kode room!');
        currentUser.isHost = false;
        localStorage.setItem('tebak_kota_user', JSON.stringify(currentUser));
        window.location.href = `/room/${code}`;
    });

    async function fetchLobbies() {
        const listDiv = document.getElementById('lobby-list');
        listDiv.innerHTML = '<p class="text-center text-sm">Memuat...</p>';
        try {
            const res = await fetch('http://localhost:3000/api/rooms');
            const rooms = await res.json();
            
            if(rooms.length === 0) {
                listDiv.innerHTML = '<p class="text-center text-sm opacity-70">Belum ada room yang tersedia.</p>';
                return;
            }
            
            listDiv.innerHTML = rooms.map(r => `
                <div class="bg-white/10 p-3 rounded-lg flex justify-between items-center hover:bg-white/20 transition cursor-pointer mb-2" onclick="joinLobby('${r.code}')">
                    <div>
                        <div class="font-bold text-sm">Room: ${r.host_name}</div>
                        <div class="text-xs opacity-80">${r.players_count}/${r.max_players} Players | Win: ${r.win_points} Pts | ${r.difficulty}</div>
                    </div>
                    <div class="font-mono bg-white/20 px-2 py-1 rounded text-sm">${r.code}</div>
                </div>
            `).join('');
        } catch(e) {
            listDiv.innerHTML = '<p class="text-center text-sm text-red-300">Gagal memuat list.</p>';
        }
    }

    // Global function to be called from inline HTML
    window.joinLobby = function(code) {
        currentUser.isHost = false;
        localStorage.setItem('tebak_kota_user', JSON.stringify(currentUser));
        window.location.href = `/room/${code}`;
    };

</script>
</body>
</html>
